name: TokaKV package qualification

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TOKA_VERSION: v1.0.0-rc.10

jobs:
  qualify:
    name: Qualify (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-22.04
            asset: toka-v1.0.0-rc.10-linux-x64.tar.gz
            sha256: baa611aed57c00a0e7e722ea84e217457a4dca6b01ee3075e5153b32fdc1075d
          - name: macos-arm64
            runner: macos-15
            asset: toka-v1.0.0-rc.10-macos-arm64.tar.gz
            sha256: d3416149988977bdfe73a04a0eb9714dba648f7c456a76830903a2f9183e3f1c

    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update -o Acquire::Retries=5
          sudo apt-get install -y build-essential curl lsb-release pkg-config \
            software-properties-common wget libssl-dev
          wget --timeout=15 --tries=3 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo -E ./llvm.sh 20
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"
          echo "CC=clang-20" >> "$GITHUB_ENV"

      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install llvm@20 pkgconf openssl@3
          llvm_prefix="$(brew --prefix llvm@20)"
          openssl_prefix="$(brew --prefix openssl@3)"
          echo "$llvm_prefix/bin" >> "$GITHUB_PATH"
          echo "CC=$llvm_prefix/bin/clang" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$openssl_prefix/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install locked Toka RC10 SDK
        env:
          TOKA_ASSET: ${{ matrix.asset }}
          TOKA_ASSET_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$TOKA_ASSET"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/tokalang/toka/releases/download/$TOKA_VERSION/$TOKA_ASSET"
          echo "$TOKA_ASSET_SHA256  $archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sdk="$RUNNER_TEMP/${TOKA_ASSET%.tar.gz}"
          test -x "$sdk/bin/toka"
          test -x "$sdk/bin/tokac"
          test -f "$sdk/lib/sys/toka_rt.c"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          echo "TOKA=$sdk/bin/toka" >> "$GITHUB_ENV"
          echo "TOKAC=$sdk/bin/tokac" >> "$GITHUB_ENV"
          echo "TOKA_LIB=$sdk/lib" >> "$GITHUB_ENV"
          echo "TOKA_SDK=$sdk" >> "$GITHUB_ENV"

      - name: Verify locked toolchain
        run: |
          set -euo pipefail
          "$TOKA" --version | grep -F "1.0.0-rc.10"
          "$TOKAC" --version | grep -F "1.0.0-rc.10"
          pkg-config --exists openssl

      - name: Run 53-stage sanitizer and diagnostic qualification
        run: TOKA_EXPECT_VERSION=1.0.0-rc.10 python3 tests/qualify_package.py

      - name: Replay the local-source ten-minute tour
        run: TOKAKV_SOURCE="$GITHUB_WORKSPACE" tools/verify_quickstart.sh

      - name: Qualify deterministic archive and archive-only replay
        run: python3 tools/qualify_release.py --sdk "$TOKA_SDK" --skip-suite
